<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, height=device-height" />
  <title>Tetis 2 main menu</title>
      <link rel="icon" href="./assets/Tetis2Icon.png" />

  <style>
    html {
      background: rgb(153, 176, 176);
background: linear-gradient(0deg, rgba(153, 176, 176, 1) 0%, rgba(188, 171, 174, 1) 49%);
      color: white;
    }
    
    button {
      background: rgb(234, 208, 208);
background: radial-gradient(circle, rgba(234, 208, 208, 1) 0%, rgba(144, 141, 141, 1) 100%);
      color: #000000;
      width: 130px;
      height: 65px;
      border-radius: 20px;
      margin: 10px;
      border: 3px solid black;
    }
    
    .tournament {
     border: 3px solid #9C0097;
    }
    .button-other{
      border: 3px solid #AF0C0C;
    }
    .center{
      
      align-content: center;
      
    }
  </style>
</head>

<body>
  <div class="center">
    <img width="350" src="assets/TetisLogo.png" />
    <br /><br /><br />
    <button onclick="startcustommode(40,7,'classic',21,10,false,false,true)">
      Play</button><br /><button onclick="startcustommode(45,8,'classic',21,10,true,false,true)">
      
  Play Tutorial</button><br><button onclick="startcustommode(30,4,'classic',20,10,false,false,false)">Play Classic</button><br><button onclick="startcustommode(30,4,'legacy',20,10,false,true,false)">
      Play Legacy</button><br>
      <button onClick="resetData()" id="resetData">reset saved data</button><br>
    <button onclick="" class="button-other">
      Bonus Modes<br>(coming in 1.1.0)</button><br>
    <button class="button-other">
      Mode Editor<br />(coming later)
    </button>
    
    <br>
    <p>v. 1.0.0</p>
  </div>
  <script src="title.js">
    
  </script>
</body>

</html>
